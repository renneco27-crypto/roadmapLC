      --text: #c9d1d9;
      --text-bright: #f0f6fc;
      --muted: #8b949e;
      --p0: #f85149;
      --p0-bg: rgba(248, 81, 73, 0.12);
      --p1: #f0883e;
      --p1-bg: rgba(240, 136, 62, 0.12);
      --p2: #bc8cff;
      --p2-bg: rgba(188, 140, 255, 0.12);
      --green: #3fb950;
      --green-bg: rgba(63, 185, 80, 0.12);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }

    /* Master Top Header Navigation Bar */
    header {

      padding: 10px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border);
      flex-wrap: wrap;
      gap: 12px;
      z-index: 50;
    }
    .brand-title {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 700;
      font-size: 15px;
      color: var(--text-bright);
    }
    .stat-badge {
      display: inline-flex;
      align-items: center;
      padding: 3px 8px;
      border-radius: 4px;
      font-size: 11px;
      font-weight: 600;
    }

    /* Main View Switcher Tabs (Mindmap vs Full Notes) */
    .view-switcher {
      display: flex;
      background: #0d1117;
      padding: 3px;
      border-radius: 8px;
      border: 1px solid var(--border);
      gap: 4px;
    }
    .view-tab-btn {
      background: none;
      border: none;
      color: var(--text);
      padding: 7px 18px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: all 0.2s;
    }
    .view-tab-btn:hover { color: #fff; background: rgba(255,255,255,0.06); }
    .view-tab-btn.active {
      background: var(--accent);
      color: #000;
    }

    /* Layout Containers: Both take 100% of the screen under header */
    .view-panel {
      display: none;
      flex: 1;
      height: calc(100vh - 55px);
      width: 100%;
      position: relative;
    }
    .view-panel.active {
      display: flex;
    }

    /* =========================================================================
       PANEL 1: 🧠 MINDMAP GRAPH VIEW (ONLY SEARCH BAR AND NODES, NO DRIFT)
       ========================================================================= */
    #panel-mindmap {
      flex-direction: column;
      position: relative;
      background: #090d13;
    }
    .mindmap-top-bar {
      position: absolute;
      top: 16px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 20;
      width: 90%;
      max-width: 640px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }
    .mindmap-search-box {
      width: 100%;
      background: rgba(22, 27, 34, 0.92);
      border: 1px solid var(--border);
      backdrop-filter: blur(12px);
      color: #fff;
      padding: 12px 18px;
      border-radius: 28px;
      font-size: 14px;
      outline: none;
      box-shadow: 0 8px 24px rgba(0,0,0,0.5);
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .mindmap-search-box:focus {
      border-color: var(--accent);
      box-shadow: 0 8px 28px rgba(88, 166, 255, 0.25);
    }
    .mindmap-filters {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      justify-content: center;
    }
    .m-pill {
      background: rgba(22, 27, 34, 0.85);
      border: 1px solid var(--border);
      backdrop-filter: blur(8px);
      color: var(--text);
      padding: 4px 10px;
      border-radius: 14px;
      font-size: 11px;
      cursor: pointer;
      transition: all 0.15s;
    }
    .m-pill:hover { background: #30363d; color: #fff; }
    .m-pill.active { background: var(--accent); color: #000; font-weight: 600; border-color: var(--accent); }

    #network-graph {
      width: 100%;
      height: 100%;
      background: #090d13;
    }

    /* Floating Status / Quick Modal for Mindmap */
    .mindmap-floating-card {
      position: absolute;
      bottom: 24px;
      right: 24px;
      background: rgba(22, 27, 34, 0.95);
      border: 1px solid var(--border-bright);
      backdrop-filter: blur(14px);
      border-radius: 12px;
      padding: 16px;
      width: 380px;
      max-width: 90vw;
      box-shadow: 0 12px 32px rgba(0,0,0,0.6);
      display: none;
      flex-direction: column;
      gap: 10px;
      z-index: 30;
      animation: fadeIn 0.2s ease-out;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .floating-card-close {
      position: absolute;
      top: 10px;
      right: 12px;
      background: none;
      border: none;
      color: var(--muted);
      cursor: pointer;
      font-size: 16px;
    }

    /* Floating Physics & Fit Buttons */
    .mindmap-controls {
      position: absolute;
      bottom: 24px;
      left: 24px;
      display: flex;
      gap: 8px;
      background: rgba(22, 27, 34, 0.85);
      border: 1px solid var(--border);
      backdrop-filter: blur(8px);
      padding: 6px;
      border-radius: 8px;
      z-index: 20;
    }
    .ctl-btn {
      background: #21262d;
      border: 1px solid var(--border);
      color: #c9d1d9;
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 12px;
      cursor: pointer;
    }
    .ctl-btn:hover { background: #30363d; color: #fff; }

    /* =========================================================================
       PANEL 2: 📚 FULL NOTES & URGENCY EXPLORER (ENTIRE SCREEN DEDICATED)
       ========================================================================= */
    #panel-notes {
      flex-direction: column;
      background: #0d1117;
      overflow: hidden;
      width: 100%;
      height: calc(100vh - 55px);
    }
    .notes-header-bar {
      background: var(--card);
      padding: 16px 24px;
      border-bottom: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .notes-search-wrapper {
      display: flex;
      gap: 12px;
      align-items: center;
    }
    .notes-search-box {
      flex: 1;
      background: #090d13;
      border: 1px solid var(--border);
      color: #fff;
      padding: 12px 18px;
      border-radius: 8px;
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s;
    }
    .notes-search-box:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 2px var(--accent-glow);
    }
    .notes-tag-bar {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      align-items: center;
    }
    .n-filter-pill {
      background: #21262d;
      border: 1px solid var(--border);
      color: var(--text);
      padding: 5px 12px;
      border-radius: 16px;
      font-size: 12px;
      cursor: pointer;
      transition: all 0.15s;
    }
    .n-filter-pill:hover { background: #30363d; color: #fff; }
    .n-filter-pill.active {
      background: var(--accent);
      color: #000;
      font-weight: 600;
      border-color: var(--accent);
    }

    /* Scrollable Notes Canvas Container */
    .notes-scroll-container {
      flex: 1;
      overflow-y: auto;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 28px;
    }

    /* Urgency Group Section */
    .urgency-section {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 2px solid var(--border);
      padding-bottom: 8px;

      display: flex;
      align-items: center;
      gap: 10px;

    .urgency-count {

      padding: 2px 8px;
      border-radius: 10px;
      font-weight: 600;
    }

    /* Grid of Note Cards */
    .notes-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(420px, 1fr));
      gap: 16px;
    }

    /* Individual Full-Width Note Card */
    .note-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 18px;
      display: flex;
      flex-direction: column;
      gap: 12px;

      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 10px;

    .card-rank {

      font-weight: 700;
      font-size: 12px;
      color: var(--accent);
      background: rgba(88, 166, 255, 0.12);
      padding: 3px 8px;
      border-radius: 4px;
      white-space: nowrap;

    .card-title {

      font-weight: 600;
      color: var(--text-bright);
      line-height: 1.35;
      flex: 1;

    .card-badges {

      gap: 6px;
      flex-wrap: wrap;
    }
    .badge {

      font-weight: 600;
      padding: 2px 7px;
      border-radius: 4px;
    }
    .card-path {

      color: var(--muted);
      word-break: break-word;
    }
    .card-focus {
      font-size: 13px;
      color: #e6edf3;
      line-height: 1.5;
    }

      border-radius: 6px;
      font-size: 11.5px;
      text-decoration: none;

          springLength: 90,
          springConstant: 0.04,
          damping: 0.12
        },
        stabilization: {
          enabled: true,
          iterations: 120,
          updateInterval: 25
        }
      },
      interaction: {
        hover: true,
        tooltipDelay: 100,
        zoomView: true,
        dragView: true
      }
    };

    const network = new vis.Network(graphContainer, graphData, graphOptions);

    // CRITICAL SENIOR FIX: Turn off physics once stabilized so the map NEVER keeps on moving!
    network.once("stabilizationIterationsDone", function () {
      network.setOptions({ physics: { enabled: false } });
      physicsEnabled = false;
      const pBtn = document.getElementById("physicsBtn");
      if (pBtn) pBtn.textContent = "Physics: OFF (Locked)";
      console.info("[+] Vis.js stabilization complete. Physics disabled to prevent node drift.");
    });

    function togglePhysics() {
      physicsEnabled = !physicsEnabled;
      network.setOptions({ physics: { enabled: physicsEnabled } });
      const pBtn = document.getElementById("physicsBtn");
      if (pBtn) pBtn.textContent = physicsEnabled ? "Physics: ON (Simulating)" : "Physics: OFF (Locked)";
    }

    function zoomIn() {
      network.moveTo({ scale: network.getScale() * 1.3, animation: true });
    }
    function zoomOut() {
      network.moveTo({ scale: network.getScale() * 0.7, animation: true });
    }

    // Node click in Mindmap -> show minimal floating card
    network.on("click", function(params) {
      if (params.nodes.length > 0) {
        const nodeId = params.nodes[0];
        const node = rawNodesData.find(n => n.id === nodeId);
        if (!node) return;
        showFloatingCard(node);
      } else {
        closeFloatingCard();
      }
    });

    function escapeHtml(str) {
      if (str === null || str === undefined) return "";
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;");
    }

    function showFloatingCard(node) {
      const card = document.getElementById("floatingCard");
      const content = document.getElementById("floatingCardContent");
      if (!card || !content) return;

      const pColor = node.color ? (node.color.background || '#58a6ff') : '#58a6ff';
      const uColor = node.urgency === 'P0_URGENT' ? 'var(--p0)' : (node.urgency === 'P1_INTERMEDIATE' ? 'var(--p1)' : 'var(--p2)');
      
      content.innerHTML = `
        <div style="display:flex; justify-content:space-between; align-items:center;">
          <span style="font-family:monospace; font-size:11px; color:var(--accent); font-weight:700;">#${escapeHtml(node.learning_order || '')}</span>
          <span class="badge" style="background:${uColor}22; color:${uColor}; border:1px solid ${uColor}44;">${escapeHtml(node.urgency_label || node.urgency || 'P0')}</span>
        </div>
        <div style="font-size:14px; font-weight:600; color:#fff; margin-top:2px;">${escapeHtml((node.label || '').replace('\n', ' '))}</div>
        <div style="font-size:11px; color:var(--muted);">${escapeHtml(node.path || '')}</div>
        <div style="display:flex; gap:8px; margin-top:6px; flex-wrap:wrap;">
          <button onclick="openNodeInFullNotes('${escapeHtml(node.id)}')" style="flex:1; background:var(--accent); color:#000; border:none; padding:8px 12px; border-radius:6px; font-weight:600; font-size:12px; cursor:pointer;">
            📚 Open in Full Notes Panel
          </button>
        </div>
        <div style="display:flex; gap:6px; margin-top:4px;">
          <a href="${escapeHtml(node.yt_url)}" target="_blank" class="yt-link-btn" style="flex:1; justify-content:center;">
            ▶ Video (${escapeHtml(node.timestamp_str || '00:00')})
          </a>
          <a href="${escapeHtml(node.reference_website_url)}" target="_blank" class="ref-link-btn" style="flex:1; justify-content:center;">
            🌐 Reference Site
          </a>
        </div>
      `;
      card.style.display = "flex";
    }

    function closeFloatingCard() {
      const card = document.getElementById("floatingCard");
      if (card) card.style.display = "none";
    }

    // =========================================================================
    // 2. VIEW SWITCHER (MINDMAP VS FULL NOTES)
    // =========================================================================
    function switchView(viewName) {
      document.querySelectorAll(".view-panel").forEach(p => p.classList.remove("active"));
      document.querySelectorAll(".view-tab-btn").forEach(b => b.classList.remove("active"));

      if (viewName === "mindmap") {
        document.getElementById("panel-mindmap").classList.add("active");
        document.getElementById("tabBtnMindmap").classList.add("active");
        setTimeout(() => network.fit({ animation: true }), 50);
      } else {
        document.getElementById("panel-notes").classList.add("active");
        document.getElementById("tabBtnNotes").classList.add("active");
      }
    }

    function openNodeInFullNotes(nodeId) {
      switchView("notes");
      const node = rawNodesData.find(n => n.id === nodeId);
      if (node) {
        const searchBox = document.getElementById("notesSearchInput");
        if (searchBox) {
          searchBox.value = node.label.replace(/^#\d+\s*/, '');
          handleNotesSearch(searchBox.value);
        }
      }
    }

    // =========================================================================
    // 3. SEMANTIC CONCEPTS EXPANSION
    // =========================================================================
    const SEMANTIC_CONCEPTS = {
      "languages": ["javascript", "typescript", "python", "java", "php", "blade", "c#", "csharp", "kotlin", "pl/pgsql", "plpgsql", "rust", "programming", "syntax", "polyglot", "developer", "coding", "code", "backend"],
      "backend": ["backend", "nodejs", "node.js", "express", "postgresql", "sql", "plpgsql", "database", "api", "rest", "jwt", "auth", "redis", "python", "java", "c#", "php", "rust", "server"],
      "frontend": ["frontend", "html", "css", "javascript", "typescript", "flutter", "dart", "figma", "canva", "ui", "ux", "animation", "motion"],
      "repair": ["repair", "hardware", "soldering", "microsoldering", "motherboard", "vrm", "ch341a", "bios", "phone", "pc", "laptop", "printer", "fuser", "printhead", "ciss", "screen", "battery", "tesda", "css", "epas", "dict", "certifications"],
      "cloud": ["cloud", "aws", "iam", "s3", "cloudwatch", "lambda", "serverless", "vpc", "resume", "nextwork", "terraform", "docker", "devops"],
      "security": ["security", "cybersecurity", "kali", "nmap", "wireshark", "burp", "metasploit", "linpeas", "privilege escalation", "ctf", "exploit", "active directory", "siem", "soc", "firewall", "ids"]
    };

    // =========================================================================
    // 4. MINDMAP SEARCH ENGINE (SEARCH BAR & NODES ONLY)
    // =========================================================================
    function handleMindmapSearch(query) {
      const q = (query || "").trim().toLowerCase();
      if (!q) {
        rawNodesData.forEach(n => nodesDataSet.update({ id: n.id, hidden: false }));
        return;
      }

      let searchTokens = q.split(/\s+/);
      let expanded = new Set(searchTokens);
      for (const [key, syns] of Object.entries(SEMANTIC_CONCEPTS)) {
        if (key.includes(q) || q.includes(key)) {
          syns.forEach(s => expanded.add(s));
        }
      }
      const tokens = Array.from(expanded);

      const updates = [];
      rawNodesData.forEach(node => {
        const titleLower = (node.label || "").toLowerCase();
        const pillarLower = (node.pillar || "").toLowerCase();
        const pathLower = (node.path || "").toLowerCase();
        const extraLower = (node.extra_keywords || "").toLowerCase();

        const match = titleLower.includes(q) || pillarLower.includes(q) || tokens.some(t => titleLower.includes(t) || extraLower.includes(t) || pathLower.includes(t));
        const isCore = node.id === "root-second-brain" || node.id.startsWith("hub-");
        updates.push({ id: node.id, hidden: !(match || isCore) });
      });
      nodesDataSet.update(updates);
    }

    function filterMindmapTag(tag) {
      document.querySelectorAll("#mindmapFiltersContainer .m-pill").forEach(p => p.classList.remove("active"));
      event.target.classList.add("active");
      const input = document.getElementById("mindmapSearchInput");
      if (tag === "all") {
        if (input) input.value = "";
        handleMindmapSearch("");
      } else {
        if (input) input.value = tag;
        handleMindmapSearch(tag);
      }
    }

    // =========================================================================
    // 5. FULL NOTES PANEL ENGINE (ALL NOTES IN URGENCY OR PER-NODE SEARCH)
    // =========================================================================
    const purePrerequisiteNodes = rawNodesData
      .filter(n => n.learning_order && n.learning_order > 0)
      .sort((a, b) => a.learning_order - b.learning_order);

    let activeNotes = [...purePrerequisiteNodes];

    function renderNotesPanel(nodesList) {
      const container = document.getElementById("notesContainer");
      if (!container) return;

      if (!nodesList.length) {
        container.innerHTML = '<div style="text-align:center; padding:60px; color:var(--muted); font-size:15px;">No matching notes found for your search.</div>';
        return;
      }

      // Group nodes into Urgency Tiers
      const p0Nodes = nodesList.filter(n => n.urgency === "P0_URGENT");
      const p1Nodes = nodesList.filter(n => n.urgency === "P1_INTERMEDIATE");
      const p2Nodes = nodesList.filter(n => n.urgency === "P2_ADVANCED");

      let html = "";

      if (p0Nodes.length > 0) {
        html += renderUrgencySection("🔥 P0: Urgent Hands-On Foundation", p0Nodes, "var(--p0)", "var(--p0-bg)");
      }
      if (p1Nodes.length > 0) {
        html += renderUrgencySection("⚡ P1: Intermediate Core & Specialization", p1Nodes, "var(--p1)", "var(--p1-bg)");
      }
      if (p2Nodes.length > 0) {
        html += renderUrgencySection("🎯 P2: Advanced & Master Milestones", p2Nodes, "var(--p2)", "var(--p2-bg)");
      }

      container.innerHTML = html;
    }

    function renderUrgencySection(title, items, color, bg) {
      let cardsHtml = items.map(n => renderNoteCard(n)).join("");
      return `
        <div class="urgency-section">
          <div class="urgency-header">
            <div class="urgency-title" style="color:${color};">
              <span>${title}</span>
              <span class="urgency-count" style="background:${bg}; color:${color};">${items.length} Notes</span>
            </div>
          </div>
          <div class="notes-grid">
            ${cardsHtml}
          </div>
        </div>
      `;
    }

    function renderNoteCard(node) {
      const uColor = node.urgency === 'P0_URGENT' ? 'var(--p0)' : (node.urgency === 'P1_INTERMEDIATE' ? 'var(--p1)' : 'var(--p2)');
      const pColor = node.color ? (node.color.background || '#58a6ff') : '#58a6ff';

      let challengeHtml = "";
      if (node.challenge) {
        challengeHtml = `<div class="card-challenge"><b>Challenge:</b> ${escapeHtml(node.challenge)}</div>`;
      }

      let commandsHtml = "";
      if (node.commands && node.commands.length > 0) {
        commandsHtml = `
          <div>
            <span style="font-size:11px; color:var(--muted); font-weight:600;">Terminal Commands:</span>
            <div class="cmd-box">${node.commands.map(c => escapeHtml(c)).join('<br>')}</div>
          </div>
        `;
      }

      let focusHtml = "";
      if (node.focus) {
        focusHtml = `<div class="card-focus">${escapeHtml(node.focus)}</div>`;
      }

      return `
        <div class="note-card" id="card-${escapeHtml(node.id)}">
          <div class="card-top">
            <span class="card-rank">#${escapeHtml(node.learning_order)}</span>
            <div class="card-title">${escapeHtml((node.label || '').replace('\n', ' '))}</div>
          </div>

          <div class="card-badges">
            <span class="badge" style="background:rgba(255,255,255,0.08); color:${pColor}; border:1px solid ${pColor}44;">${escapeHtml(node.pillar_short || 'Pillar')}</span>
            <span class="badge" style="background:${uColor}22; color:${uColor}; border:1px solid ${uColor}44;">${escapeHtml(node.urgency_label || node.urgency || 'P0')}</span>
            ${node.is_beginner ? '<span class="badge" style="background:var(--green-bg); color:var(--green); border:1px solid var(--green)44;">Beginner Core</span>' : ''}
          </div>

          <div class="card-path">Path: <code style="color:#58a6ff;">${escapeHtml(node.path || '')}</code></div>

          ${focusHtml}
          ${challengeHtml}
          ${commandsHtml}

          <!-- Reference Material Website & Timestamped YouTube Lecture -->
          <div class="card-links-row">
            <a href="${escapeHtml(node.reference_website_url)}" target="_blank" class="ref-link-btn">
              🌐 Reference Website: <b>${escapeHtml(node.reference_website_title || 'Documentation')}</b> ↗
            </a>
            <a href="${escapeHtml(node.yt_url)}" target="_blank" class="yt-link-btn">
              ▶ YouTube Lecture (${escapeHtml(node.timestamp_str || '00:00')}): <b>${escapeHtml(node.yt_title || 'Video Course')}</b> ↗
            </a>
            ${node.snippet_text ? `<div class="yt-snippet">&ldquo;${escapeHtml(node.snippet_text)}&rdquo;</div>` : ''}
          </div>
        </div>
      `;
    }

    function handleNotesSearch(rawQuery) {
      const q = (rawQuery || "").trim().toLowerCase();
      if (!q) {
        activeNotes = [...purePrerequisiteNodes];
        renderNotesPanel(activeNotes);
        return;
      }

      let searchTokens = q.split(/\s+/);
      let expanded = new Set(searchTokens);
      for (const [key, syns] of Object.entries(SEMANTIC_CONCEPTS)) {
        if (key.includes(q) || q.includes(key) || searchTokens.some(t => key.includes(t))) {
          syns.forEach(s => expanded.add(s));
        }
      }
      const tokens = Array.from(expanded);

      activeNotes = purePrerequisiteNodes.filter(node => {
        const titleLower = (node.label || "").toLowerCase();
        const pillarLower = (node.pillar || "").toLowerCase();
        const pathLower = (node.path || "").toLowerCase();
        const extraLower = (node.extra_keywords || "").toLowerCase();
        const kwList = (node.keywords || []).map(k => String(k).toLowerCase());

        return titleLower.includes(q) || 
               pillarLower.includes(q) || 
               pathLower.includes(q) ||
               tokens.some(t => titleLower.includes(t) || kwList.includes(t) || extraLower.includes(t));
      });

      renderNotesPanel(activeNotes);
    }

    function filterNotesByTag(tag) {
      document.querySelectorAll("#notesTagBar .n-filter-pill").forEach(p => p.classList.remove("active"));
      event.target.classList.add("active");

      const searchBox = document.getElementById("notesSearchInput");
      if (tag === "all") {
        if (searchBox) searchBox.value = "";
        activeNotes = [...purePrerequisiteNodes];
        renderNotesPanel(activeNotes);
      } else if (tag.startsWith("P0_") || tag.startsWith("P1_") || tag.startsWith("P2_")) {
        if (searchBox) searchBox.value = "";
        activeNotes = purePrerequisiteNodes.filter(n => n.urgency === tag);
        renderNotesPanel(activeNotes);
      } else {
        if (searchBox) searchBox.value = tag;
        handleNotesSearch(tag);
      }
    }

    // Initialize full notes panel
    renderNotesPanel(purePrerequisiteNodes);
  </script>
</body>
</html>
